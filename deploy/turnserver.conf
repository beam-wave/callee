# coturn config for Callee. Secret / external IP are passed on the command line
# from docker-compose (see TURN_SECRET / TURN_EXTERNAL_IP in .env).
listening-port=3478
fingerprint
use-auth-secret
realm=callee
# Relay port range: open these UDP ports in your firewall.
min-port=49160
max-port=49250
no-cli
no-tls
no-dtls
no-multicast-peers
log-file=stdout
simple-log
# Audio only: keep per-allocation bandwidth sane (bytes/sec, ~ 128 kbps).
max-bps=16000
total-quota=2000
stale-nonce=600
# Allow relaying to the app container only (server-mode media); this must
# match the compose network subnet. allowed-peer-ip wins over denied-peer-ip.
allowed-peer-ip=172.30.0.0-172.30.0.255
# Never relay into private / internal networks (SSRF protection).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
