<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Offline · Callee</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1f2937; --muted: #6b7280; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111318; --fg: #e5e7eb; --muted: #9ca3af; --card: #1b1e25; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
  .card { background: var(--card); border-radius: 20px; padding: 32px 24px; max-width: 360px; text-align: center;
          box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.35rem; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { background: #6366f1; color: #fff; border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <img src="/images/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Callee needs an internet connection to make and receive calls. We'll reconnect as soon as you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", () => location.reload())</script>
</body>
</html>
